name: BDBV historical ambiguous health-zone row dissection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dissect_ambiguous_healthzones.py'
      - 'tests/test_dissect_ambiguous_healthzones.py'
      - '.github/workflows/bdbv-dissect-zone-ambiguities.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test PDF cell disambiguation safety
        run: python -m pip install pytest && python -m pytest -q tests/test_dissect_ambiguous_healthzones.py
      - name: Retrieve preserved historical zone comparison
        run: |
          mkdir -p work/source
          gh release download bdbv-historical-zone-review-42476718553 \
            --pattern historical_zone_review_ledgers.zip --dir work/source
          unzip -q work/source/historical_zone_review_ledgers.zip -d work/source
      - name: Classify ambiguous same-name PDF source cells
        run: |
          python dissect_ambiguous_healthzones.py \
            --registry state/registry.json \
            --published published \
            --zone-ledger work/source/healthzone_reconciliation/healthzone_concordance.jsonl \
            --out work/ambiguous_rows
      - name: Preserve full cell-level ambiguity register
        run: |
          gh release create "bdbv-zone-ambiguity-${{ github.run_id }}" \
            work/ambiguous_rows/ambiguous_healthzone_summary.json \
            work/ambiguous_rows/ambiguous_healthzone_pdf_rows.jsonl \
            --title "BDBV historical zone cell ambiguity investigation ${{ github.run_id }}" \
            --notes "Source PDF cell identities classified. Equal numbers in different source rows or provinces remain ambiguous; no numerical approval."
