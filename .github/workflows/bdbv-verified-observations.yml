name: BDBV strictly source-verified original PDF observations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build_verified_source_observations.py'
      - 'tests/test_verified_source_observations.py'
      - '.github/workflows/bdbv-verified-observations.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Enforce original source identity
        run: python -m pip install pytest && python -m pytest -q tests/test_verified_source_observations.py
      - name: Verify explicitly visually checked source figures and boundaries
        run: python build_verified_source_observations.py --out work/verbatim
      - name: Archive immutable limited-scope source transcription verification
        run: |
          TAG="bdbv-source-verified-readings-${{ github.run_id }}"
          gh release create "$TAG" work/verbatim/* \
            --title "BDBV explicitly verified original PDF readings ${{ github.run_id }}" \
            --notes "17 individually visually reviewed PDF readings (national 10, zone 7) with source hash and locations. Verbatim reporting verification is NOT epidemiological truth, independence, or complete series approval."
