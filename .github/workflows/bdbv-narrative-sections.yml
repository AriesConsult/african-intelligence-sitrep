name: BDBV historical narrative section reconstruction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stage_narrative_sections.py'
      - 'tests/test_narrative_sections.py'
      - '.github/workflows/bdbv-narrative-sections.yml'

permissions:
  contents: write

jobs:
  stage-sections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify lossless page-text segmentation
        run: python -m pip install pytest && python -m pytest -q tests/test_narrative_sections.py
      - name: Download immutable SHA-verified full-page extract archive
        run: |
          mkdir -p work/full_archive work/full_pages
          gh release download bdbv-source-extract-evidence-42474203980 --pattern full_pages.tar.gz --dir work/full_archive
          tar -xzf work/full_archive/full_pages.tar.gz -C work/full_pages
      - name: Reconstruct all candidate numbered sections without losing source text
        run: python stage_narrative_sections.py --full-dir work/full_pages --out work/narrative_sections
      - name: Preserve full source text and exact section boundary references
        run: |
          TAG="bdbv-narrative-sections-${{ github.run_id }}"
          gh release create "$TAG" \
            work/narrative_sections/narrative_section_staging_summary.json \
            work/narrative_sections/narrative_section_report_index.json \
            work/narrative_sections/narrative_full_section_candidates.jsonl.gz \
            --title "BDBV full-page narrative section candidates ${{ github.run_id }}" \
            --notes "Mechanical lossless reconstruction of source PDF text into heuristic section candidates. Section boundaries, reading order and scanned text are not yet source-verified."
