name: BDBV historical cumulative and zone-cell adjudication triage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'triage_historical_acceptance.py'
      - 'tests/test_historical_exception_triage.py'
      - '.github/workflows/bdbv-historical-exception-triage.yml'

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate non-approval safeguards
        run: python -m pip install pytest && python -m pytest -q tests/test_historical_exception_triage.py
      - name: Retrieve immutable historical revisions and source-linked zone exceptions
        run: |
          mkdir -p work/input/revisions work/input/zone
          gh release download bdbv-historical-assembly-42479820408 \
             --pattern historical_cumulative_revision_flags.csv --dir work/input/revisions
          gh release download bdbv-historical-zone-review-42476718553 \
             --pattern historical_zone_review_ledgers.zip --dir work/input/zone
          unzip -q work/input/zone/historical_zone_review_ledgers.zip -d work/input/zone
      - name: Examine every historical decrease and ambiguous source row
        run: |
          python triage_historical_acceptance.py \
            --revisions work/input/revisions/historical_cumulative_revision_flags.csv \
            --zones work/input/zone/healthzone_reconciliation/healthzone_concordance.jsonl \
            --out work/adjudication
      - name: Preserve full exception adjudication evidence
        run: |
          TAG="bdbv-historical-exception-triage-${{ github.run_id }}"
          gh release create "$TAG" work/adjudication/* \
            --title "BDBV cumulative and zone source-identity review ${{ github.run_id }}" \
            --notes "Source-identity analysis for 114 decreases and 174 ambiguous matches. Only mechanically proven duplicate identities may be collapsed; otherwise review remains open."
