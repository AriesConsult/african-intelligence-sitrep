name: African Intelligence BDBV SitRep ingest and publication

on:
  push:
    branches:
      - main
    paths:
      - 'run_pipeline.py'
      - 'discovery.py'
      - 'ingest.py'
      - 'extraction.py'
      - 'validation.py'
      - 'candidates.py'
      - 'sitrep_tables.py'
      - 'reprocess_tables.py'
      - 'sitrep_narratives.py'
      - 'backfill_narratives.py'
      - 'build_narrative_signals.py'
      - 'audit_ingestion.py'
      - 'audit_source_to_extraction.py'
      - 'verify_publication.py'
      - 'review_approved.py'
      - 'requirements.txt'
      - '.github/workflows/bdbv-sitrep-pipeline.yml'
  schedule:
    - cron: '27 5 * * *'   # Daily 08:27 East Africa Time (UTC+3)
    - cron: '41 4 * * 0'   # Sunday historical backfill
  workflow_dispatch:
    inputs:
      full_backfill:
        description: 'Check all discoverable SitReps (may take considerable time)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bdbv-sitrep-main
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the pipeline repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF processing dependencies
        run: python -m pip install -r requirements.txt pytest reportlab
      - name: Run extraction and validation tests
        run: python -m pytest -q tests
      - name: Discover, extract and validate SitReps
        run: |
          if [ '${{ inputs.full_backfill }}' = 'true' ] || [ '${{ github.event.schedule }}' = '41 4 * * 0' ]; then
            LIMIT=0
          else
            LIMIT=12
          fi
          python run_pipeline.py --limit "$LIMIT" --work work
      - name: Reanalyse validated SitRep tables 1–5
        if: success()
        run: |
          if [ -f reprocess_tables.py ]; then
            python reprocess_tables.py
          else
            echo "Five-table module not installed; preserving existing feed."
          fi
      - name: Extract hash-verified narrative candidates for editorial review
        if: success()
        run: |
          if [ '${{ inputs.full_backfill }}' = 'true' ] || [ '${{ github.event_name }}' = 'push' ] || [ '${{ github.event.schedule }}' = '41 4 * * 0' ]; then
            NARRATIVE_LIMIT=0
          else
            NARRATIVE_LIMIT=12
          fi
          python backfill_narratives.py --limit "$NARRATIVE_LIMIT" --work work/narrative_full_text
      - name: Build review-only longitudinal narrative signal index
        if: success()
        run: python build_narrative_signals.py
      - name: Audit source identities and numerical validation coverage
        if: success()
        run: python audit_ingestion.py
      # Archive new originals before source-to-extraction audit. The archive job
      # cannot see uncommitted registry additions; running this after the audit
      # created a circular dependency for newly discovered SitReps.
      - name: Build hash-verified archive of newly discovered original PDFs
        id: new_originals
        run: |
          python archive_originals.py build --out work/source_archive
          if [ -s work/source_archive/original_sitreps.zip ]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish durable original PDF release before integrity audit
        if: steps.new_originals.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="bdbv-sitrep-originals-${{ github.run_id }}"
          gh release create "$TAG" \
            work/source_archive/original_sitreps.zip \
            work/source_archive/archive_manifest.json \
            --title "BDBV official SitRep original PDFs — SHA-verified archive ${{ github.run_id }}" \
            --notes "Unmodified original PDFs, SHA-256 verified against the discovered registry. Publication of extracted data remains subject to downstream integrity checks."
      - name: Register verified original archive in current evidence working copy
        if: steps.new_originals.outputs.needed == 'true'
        run: |
          python archive_originals.py finalize \
            --tag "bdbv-sitrep-originals-${{ github.run_id }}" \
            --repository "${{ github.repository }}" \
            --published published \
            --manifest work/source_archive/archive_manifest.json
      - name: Audit entire source-to-extraction artifact collection
        if: success()
        run: python audit_source_to_extraction.py
      - name: Gate publication against reconciled data and narrative snapshots
        if: success()
        run: python verify_publication.py
      - name: Preserve source PDFs and extraction audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdbv-sitrep-audit-${{ github.run_id }}
          path: work/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit validated feed and review state
        if: success()
        run: |
          git config user.name 'african-intelligence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add state/registry.json published/ review_queue/
          if ! git diff --cached --quiet; then
            git commit -m 'Update BDBV SitRep source registry and validated feed'
            # The repository can change during a long PDF backfill.
            # Rebase generated results onto the current remote tip before pushing.
            # Never force-push or silently overwrite a conflicting update.
            # A newer code/data commit can arrive during a long extraction.
          fi
          # Never force-merge or overwrite newer generated source ledgers.
          git fetch origin "$GITHUB_REF_NAME"
          if ! git merge-base --is-ancestor "origin/$GITHUB_REF_NAME" HEAD; then
            echo "Remote branch advanced during extraction; this stale run will not publish." >&2
            echo "The newest scheduled or dispatched run can recompute from the updated tip."
            echo "No evidence ledger is overwritten by this stale run; retry from the current main commit."
            exit 0
          fi
          if git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "Published source-verified SitRep results."
            exit 0
          fi
          echo "Concurrent push was detected; leaving the newer remote unchanged." >&2
          exit 0
