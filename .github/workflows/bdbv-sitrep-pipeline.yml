name: African Intelligence BDBV SitRep ingest and publication

on:
  push:
    branches:
      - main
    paths:
      - '*.py'
      - 'tests/**'
      - '.github/workflows/bdbv-sitrep-pipeline.yml'
  schedule:
    - cron: '27 5 * * *'   # Daily 08:27 East Africa Time (UTC+3)
    - cron: '41 4 * * 0'   # Sunday historical backfill
  workflow_dispatch:
    inputs:
      full_backfill:
        description: 'Check all discoverable SitReps (may take considerable time)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bdbv-sitrep-main
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the pipeline repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF processing dependencies
        run: python -m pip install -r requirements.txt pytest reportlab
      - name: Run extraction and validation tests
        run: python -m pytest -q tests
      - name: Discover, extract and validate SitReps
        run: |
          if [ '${{ inputs.full_backfill }}' = 'true' ] || [ '${{ github.event.schedule }}' = '41 4 * * 0' ]; then
            LIMIT=0
          else
            LIMIT=12
          fi
          python run_pipeline.py --limit "$LIMIT" --work work
      - name: Reanalyse validated SitRep tables 1–5
        if: success()
        run: |
          if [ -f reprocess_tables.py ]; then
            python reprocess_tables.py
          else
            echo "Five-table module not installed; preserving existing feed."
          fi
      - name: Extract hash-verified narrative candidates for editorial review
        if: success()
        run: |
          if [ '${{ inputs.full_backfill }}' = 'true' ] || [ '${{ github.event_name }}' = 'push' ] || [ '${{ github.event.schedule }}' = '41 4 * * 0' ]; then
            NARRATIVE_LIMIT=0
          else
            NARRATIVE_LIMIT=12
          fi
          python backfill_narratives.py --limit "$NARRATIVE_LIMIT" --work work/narrative_full_text
      - name: Audit source identities and numerical validation coverage
        if: success()
        run: python audit_ingestion.py
      - name: Preserve source PDFs and extraction audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdbv-sitrep-audit-${{ github.run_id }}
          path: work/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit validated feed and review state
        if: success()
        run: |
          git config user.name 'african-intelligence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add state/registry.json published/ review_queue/
          if ! git diff --cached --quiet; then
            git commit -m 'Update BDBV SitRep source registry and validated feed'
            # The repository can change during a long PDF backfill.
            # Rebase generated results onto the current remote tip before pushing.
            # Never force-push or silently overwrite a conflicting update.
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME"
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "Published SitRep analysis after synchronizing with main."
                exit 0
              fi
              echo "Remote changed during push (attempt $attempt); retrying."
              sleep 3
            done
            echo "Unable to push SitRep results safely after three attempts." >&2
            exit 1
          fi
