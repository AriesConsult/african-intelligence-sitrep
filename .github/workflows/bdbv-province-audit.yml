name: Historical provincial table source-fidelity audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'audit_province_tables.py'
      - 'tests/test_province_table_audit.py'
      - '.github/workflows/bdbv-province-audit.yml'

permissions:
  contents: write

concurrency:
  group: bdbv-provincial-audit
  cancel-in-progress: false

jobs:
  audit-provinces:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test provenance and nonpromotion safeguards
        run: python -m pip install pytest && python -m pytest -q tests/test_province_table_audit.py
      - name: Audit all registered PDF provincial totals and zone-coverage discrepancies
        run: python audit_province_tables.py --out work/provincial_audit
      - name: Publish versioned evidence-only provincial audit
        run: |
          TAG="bdbv-provincial-audit-${{ github.run_id }}"
          gh release create "$TAG"             work/provincial_audit/provincial_audit_summary.json             work/provincial_audit/provincial_cells_review.csv             work/provincial_audit/provincial_report_coverage.csv             --title "BDBV source-linked provincial table audit ${{ github.run_id }}"             --notes "Provisional extraction reconciliation, NOT approved outbreak statistics. Reports with missing structure or unequal values remain in review."
      - name: Preserve CI audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdbv-provincial-audit-${{ github.run_id }}
          path: work/provincial_audit/
          if-no-files-found: warn
          retention-days: 90
