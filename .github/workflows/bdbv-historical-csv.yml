name: BDBV historical analyst-ready CSV export (review only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'export_historical_review_csv.py'
      - 'tests/test_historical_csv_export.py'
      - '.github/workflows/bdbv-historical-csv.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Test provenance-preserving tidy export
        run: python -m pip install pytest && python -m pytest -q tests/test_historical_csv_export.py
      - name: Retrieve immutable historically aligned records
        run: |
          mkdir -p work/aligned
          gh release download bdbv-historical-aligned-42482026260 \
            --pattern historical_evidence_aligned.jsonl.gz \
            --pattern historical_evidence_alignment_summary.json \
            --dir work/aligned
      - name: Export complete historical CSV with provenance, status and confidence
        run: |
          python export_historical_review_csv.py \
            --aligned work/aligned/historical_evidence_aligned.jsonl.gz \
            --summary work/aligned/historical_evidence_alignment_summary.json \
            --out work/historical_csv
      - name: Preserve structured table and dictionary as a versioned immutable release
        run: |
          TAG="bdbv-historical-review-csv-${{ github.run_id }}"
          gh release create "$TAG" work/historical_csv/* \
            --title "BDBV historical long-form data + provenance CSV ${{ github.run_id }}" \
            --notes "15,726 source-linked historical rows. This is an analyst review candidate table, not a certified outbreak daily-incidence series. For every value retain original source, discrepancy status, date, geographic label and review state."
