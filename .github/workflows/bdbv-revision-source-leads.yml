name: BDBV cumulative revision original-source language search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'locate_explicit_historical_revisions.py'
      - 'tests/test_revision_source_locator.py'
      - '.github/workflows/bdbv-revision-source-leads.yml'

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify review-only source-language decision logic
        run: python -m pip install pytest && python -m pytest -q tests/test_revision_source_locator.py
      - name: Retrieve original source text and complete curated cumulative decrease register
        run: |
          mkdir -p work/archive work/full work/revisions
          gh release download bdbv-source-extract-evidence-42474203980 \
            --pattern full_pages.tar.gz --dir work/archive
          tar -xzf work/archive/full_pages.tar.gz -C work/full
          gh release download bdbv-historical-assembly-42479820408 \
            --pattern historical_cumulative_revision_flags.csv --dir work/revisions
      - name: Search original SitRep correction language without changing any historical value
        run: |
          python locate_explicit_historical_revisions.py \
            --revisions work/revisions/historical_cumulative_revision_flags.csv \
            --full-pages work/full --out work/revision_leads
      - name: Preserve immutable original page revision leads
        run: |
          TAG="bdbv-source-revision-leads-${{ github.run_id }}"
          gh release create "$TAG" work/revision_leads/* \
            --title "BDBV original SitRep historical revision context ${{ github.run_id }}" \
            --notes "All 114 cumulative declines linked to nearby original source-page correction-language review leads where available; keywords are not source-grounded numerical revision approvals."
