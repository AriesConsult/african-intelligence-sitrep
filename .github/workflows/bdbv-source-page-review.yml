name: BDBV visually reviewable original PDF exception pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'render_exception_source_pages.py'
      - 'tests/test_source_page_review_pack.py'
      - '.github/workflows/bdbv-source-page-review.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original PDF renderer source-integrity safeguards
        run: |
          python -m pip install pymupdf pytest
          python -m pytest -q tests/test_source_page_review_pack.py
      - name: Fetch immutable 158-PDF archive and latest exception ledgers
        run: |
          set -euo pipefail
          mkdir -p work/originals work/decisions work/ambiguities
          gh release download bdbv-sitrep-originals-42413796114 \
            --pattern original_sitreps.zip --dir work/originals
          gh release download bdbv-historical-adjudication-42485104589 \
            --pattern historical_exception_decision_register.csv --dir work/decisions
          gh release download bdbv-zone-ambiguity-42485037633 \
            --pattern ambiguous_healthzone_pdf_rows.jsonl --dir work/ambiguities
      - name: Render all uniquely referenced original PDF pages at readable resolution
        run: |
          python render_exception_source_pages.py \
            --archive work/originals/original_sitreps.zip \
            --index published/source_archive_index.json \
            --decisions work/decisions/historical_exception_decision_register.csv \
            --ambiguities work/ambiguities/ambiguous_healthzone_pdf_rows.jsonl \
            --out work/source_page_reviews
      - name: Publish immutable source-page evidence pack
        run: |
          gh release create "bdbv-original-exception-pages-${{ github.run_id }}" \
            work/source_page_reviews/review_page_manifest.json \
            work/source_page_reviews/review_page_images.zip \
            --title "Original INSP PDF visual verification pages for unresolved history — ${{ github.run_id }}" \
            --notes "Original PDF page images, each rendered from a SHA256-matched immutable archived PDF and annotated with its exact unresolved national or zone questions. These are review materials, not completed human adjudications."
