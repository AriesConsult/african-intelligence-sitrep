name: BDBV automated daily weekly monthly source bulletins
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'generate_bdbv_bulletins.py'
      - 'build_bdbv_assessments.py'
      - 'tests/test_bdbv_assessments.py'
      - 'tests/test_bdbv_bulletins.py'
      - '.github/workflows/bdbv-bulletins.yml'
  schedule:
    - cron: '25 7 * * *' # 10:25 Nairobi after regular source ingestion
permissions:
  contents: write
concurrency:
  group: bdbv-rulebased-bulletins
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deterministic generator
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests/test_bdbv_bulletins.py tests/test_bdbv_assessments.py tests/test_inrb_staging.py
      - name: Fetch accepted historical evidence
        run: |
          mkdir -p work/evidence
          if ! gh release download bdbv-qualified-historical-42498372593 \
              --pattern historical_qualified_release.csv --dir work/evidence; then
              echo 'GitHub authenticated release retrieval failed; trying public endpoint.'
              curl -fLsS --retry 8 --retry-all-errors --retry-delay 4 --max-time 300 \
                https://github.com/AriesConsult/african-intelligence-sitrep/releases/download/bdbv-qualified-historical-42498372593/historical_qualified_release.csv \
                -o work/evidence/historical_qualified_release.csv
          fi
          test "$(wc -c < work/evidence/historical_qualified_release.csv)" -gt 4000000
      - name: Pin latest INRB source revision
        id: upstream
        run: |
          SHA="$(curl -fLsS --retry 3 https://api.github.com/repos/INRB-UMIE/BDBV2026-Data/commits/main | python -c 'import sys,json; print(json.load(sys.stdin)["sha"])')"
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Stage current INRB source candidates
        run: |
          python stage_inrb_series.py --registry state/registry.json --inrb-commit "${{ steps.upstream.outputs.sha }}" --out work/current_stage
      - name: Reprocess archived original SitRep table grids using latest semantics
        run: |
          # Local working-copy reprocessing only; does NOT publish or rewrite the operational feed.
          python reprocess_tables.py --queue review_queue --published published --registry state/registry.json --feed work/bulletin_source_feed.json
      - name: Back-create historical and current bilingual editions
        run: |
          python generate_bdbv_bulletins.py --accepted work/evidence/historical_qualified_release.csv --stage work/current_stage --published published --out work/output
      - name: Build weekly and monthly analytical evidence packs
        run: |
          python build_bdbv_assessments.py \
            --evidence work/output/BULLETIN_ANALYTICAL_EVIDENCE.json \
            --out work/assessments
      - name: Generate optional editorial AI assessment drafts
        if: ${{ vars.BDBV_AI_ASSESSMENTS_ENABLED == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BDBV_AI_MODEL: ${{ vars.BDBV_AI_MODEL }}
        run: |
          python build_bdbv_assessments.py \
            --evidence work/output/BULLETIN_ANALYTICAL_EVIDENCE.json \
            --out work/assessments \
            --draft-ai
      - name: Archive private analytical evidence and drafts
        uses: actions/upload-artifact@v4
        with:
          name: bdbv-assessment-review-${{ github.run_id }}
          path: work/assessments/
          retention-days: 90
      - name: Validate publication links and source data
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('work/output/bdvd2026')
          c=json.loads((root/'assets/data/bulletins_public.json').read_text())
          assert c['schema_version']=='ai-bdbv-published-bulletins-v1'
          assert len(c['bulletins'])>=100
          for item in c['bulletins']:
              assert item['status']=='published'
              for lang in item['languages']:
                  assert (pathlib.Path('work/output')/lang['url'].lstrip('/')).is_file()
          assert (root/'assets/data/contact_tracing_public.json').is_file()
          assert (root/'assets/data/weekly_national_public.json').is_file()
          print('Validated',len(c['bulletins']),'bilingual source editions')
          PY
      - name: Package and validate upload to One.com
        run: |
          cd work/output
          zip -qr ../BDBV_BULLETINS_SITE_UPLOAD.zip bdvd2026
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          archive=Path('../BDBV_BULLETINS_SITE_UPLOAD.zip')
          with ZipFile(archive) as z:
              assert z.testzip() is None, 'ZIP CRC verification failed'
              files=set(z.namelist())
              expected={'bdvd2026/assets/data/bulletins_public.json',
                        'bdvd2026/assets/data/weekly_national_public.json',
                        'bdvd2026/assets/data/contact_tracing_public.json'}
              assert expected<=files, 'Missing dashboard data assets'
              catalog=json.loads(z.read('bdvd2026/assets/data/bulletins_public.json'))
              for bulletin in catalog['bulletins']:
                  for language in bulletin['languages']:
                      path=language['url'].lstrip('/')
                      assert path in files, path
                      page=z.read(path).decode('utf-8')
                      assert '/assets/css/african-intelligence.css' in page
                      assert 'class="bulletin-page"' in page
                      assert 'id="annex"' in page
              print('Validated ZIP:', len(catalog['bulletins']), 'bilingual bulletin periods')
          PY
      - name: Preserve archive linked to source and generator revisions
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          GEN_HASH="$(sha256sum generate_bdbv_bulletins.py build_bdbv_assessments.py sitrep_tables.py published/table_index.json published/narrative_index.json | sha256sum | cut -c1-12)"
          TAG="bdbv-rulebased-bulletins-${UPSTREAM_SHA:0:12}-${GEN_HASH}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Identical source and generator release already exists.'
          else
            gh release create "$TAG" work/BDBV_BULLETINS_SITE_UPLOAD.zip work/output/BULLETIN_BUILD_REPORT.json --title 'BDBV deterministic bilingual daily weekly monthly bulletins' --notes 'Generated from GitHub-extracted qualified historical INRB data and subsequent pinned INRB candidate records. No AI-generated narrative, no fabricated incidence, limited zone-sum contact reporting.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bdbv-bulletins-site-${{ github.run_id }}
          path: |
            work/BDBV_BULLETINS_SITE_UPLOAD.zip
            work/output/BULLETIN_BUILD_REPORT.json
          retention-days: 90
      - name: Optional One.com SFTP synchronization
        env:
          ENABLED: ${{ vars.BDBV_BULLETIN_DEPLOY_ENABLED }}
          HOST: ${{ vars.BDBV_SFTP_HOST }}
          USER: ${{ vars.BDBV_SFTP_USER }}
          PASS: ${{ secrets.BDBV_SFTP_PASSWORD }}
          HOST_KEYS: ${{ secrets.BDBV_SFTP_KNOWN_HOSTS }}
          REMOTE: ${{ vars.BDBV_SFTP_WEB_ROOT }}
        run: |
          if [ "$ENABLED" != 'true' ]; then
            echo 'SFTP deployment disabled. Versioned ZIP remains available in GitHub Releases.'
            exit 0
          fi
          : "${HOST:=ssh.africa-research.eu}"
          : "${USER:=africa-research.eu}"
          test -n "$HOST" && test -n "$USER" && test -n "$PASS" && test -n "$HOST_KEYS" && test -n "$REMOTE" || {
            echo 'SFTP setup incomplete: provide verified host key, password and explicit remote website root.'
            exit 1
          }
          # Never accept an SSH key learned over an unverified network connection.
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null || {
            echo 'Pinned SSH known_hosts does not contain the SFTP hostname.'
            exit 1
          }
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          # No --delete. Scope is limited to bulletin pages and their three JSON feeds.
          # Quoted SFTP URL and lftp's ssh connect-program ensure port 22 + host-key validation.
          lftp -u "$USER","$PASS" "sftp://$HOST:22" -e "
            set cmd:fail-exit true;
            set net:max-retries 3;
            set sftp:connect-program \"ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts\";
            mirror -R --only-newer work/output/bdvd2026/bulletins $REMOTE/bdvd2026/bulletins;
            mirror -R --only-newer work/output/bdvd2026/assets/data $REMOTE/bdvd2026/assets/data;
            bye"
