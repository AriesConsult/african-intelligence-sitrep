name: BDBV full-page PDF ingestion fidelity audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'extract_full_pages.py'
      - 'render_flagged_pages.py'
      - 'preserve_raster_assets.py'
      - 'inventory_extracted_content.py'
      - 'tests/test_content_inventory.py'
      - 'tests/test_full_page_extraction.py'
      - '.github/workflows/bdbv-full-pages.yml'

permissions:
  contents: read

concurrency:
  group: bdbv-full-page-audit
  cancel-in-progress: false

jobs:
  full-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest reportlab
      - name: Validate extraction regression tests
        run: python -m pytest -q tests/test_full_page_extraction.py tests/test_content_inventory.py
      - name: Retrieve original PDF release asset with authenticated GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p work/source_archive
          for attempt in 1 2 3 4; do
            if gh release download bdbv-sitrep-originals-42413796114 --pattern original_sitreps.zip --dir work/source_archive --clobber; then
              test -s work/source_archive/original_sitreps.zip && break
            fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Verify every archived original PDF and extract all pages
        run: python extract_full_pages.py --zip work/source_archive/original_sitreps.zip --out work/full_page_audit
      - name: Inventory all source-linked extracted text for availability and review
        run: python inventory_extracted_content.py --full-pages work/full_page_audit --output work/content_inventory
      - name: Preserve per-report content availability and exceptions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdbv-content-inventory-${{ github.run_id }}
          path: work/content_inventory/
          if-no-files-found: warn
          retention-days: 90
      - name: Render flagged original pages for visual fidelity review
        run: |
          python render_flagged_pages.py --zip work/source_archive/original_sitreps.zip --audit-dir work/full_page_audit --output work/flagged_page_renders
      - name: Preserve embedded raster images from all archived PDF pages
        run: |
          python preserve_raster_assets.py --zip work/source_archive/original_sitreps.zip --audit-dir work/full_page_audit --output work/raster_preservation
      - name: Retain raster resource inventory and exact binary assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdbv-raster-assets-${{ github.run_id }}
          path: work/raster_preservation/
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve rendered pages and targeted-review index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdbv-flagged-page-renders-${{ github.run_id }}
          path: work/flagged_page_renders/
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve complete per-page extracts and exception register for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdbv-full-page-extraction-${{ github.run_id }}
          path: work/full_page_audit/
          if-no-files-found: error
          retention-days: 90
